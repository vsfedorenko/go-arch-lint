# More info: https://golangci-lint.run/docs/configuration/file/
version: "2"

run:
  tests: true
  go: "1.25"
  build-tags:
    - integration

output:
  formats:
    text:
      print-issued-lines: true
      print-linter-name: true

linters:
  # v2: вместо disable-all используем default: none
  default: none
  enable:
    # Базовые качество/стиль
    - unused                        # Неиспользуемые константы/переменные/функции/типы
    - staticcheck                   # Большой набор проверок (honnef.co/go/tools)
    - govet                         # Встроенный "go vet": подозрительные конструкции
    - revive                        # Гибкий стилевой линтер (на замену golint)
    - whitespace                    # Лишние пустые строки в начале/конце блоков и т.п.
    - asciicheck                    # ASCII-только: стиль идентификаторов/комментариев
    - misspell                      # Опечатки в комментариях/строках
    - dupword                       # Повторяющиеся слова
    - decorder                      # Порядок объявлений (const/type/var/func)
    - goconst                       # Повторяющиеся литералы → константы
    - tagalign                      # Выравнивание тегов структур

    # Ошибки и обработка ошибок
    - errcheck                      # Непроверенные ошибки
    - errorlint                     # Правильная работа с обёртками ошибок (Go 1.13+)
    - errname                       # Имена ошибок: Err* / *Error

    # Контекст/конкурентность/тесты
    - copyloopvar                   # Копирование переменной цикла (замыкания/го‑рутины)

    # Производственный код/практики
    - ineffassign                   # Присваивания без использования
    - wastedassign                  # "Бесполезные" присваивания
    - unconvert                     # Лишние преобразования типов
    - predeclared                   # Затенение предобъявленных идентификаторов
    - makezero                      # make с ненулевой длиной
    - gochecknoinits                # Запрещает init(): больше предсказуемости и тестопригодности
    - gosec                         # Статический анализ на уязвимости (безопасность)

    # Тесты / testify-гигиена
    - testifylint                   # Идиоматичные testify-ассерты (Empty вместо Len(x,0) и т.д.)
    - thelper                       # t.Helper() в тестовых хелперах

    # Качество кода
    - gocritic                      # Доп. диагностики (ifElseChain, offBy1, ...)
    - intrange                      # for i := range N вместо классических циклов (Go 1.22+)
    - usestdlibvars                 # http.MethodGet вместо "GET" и др.
    - dogsled                       # Не более 2 пустых идентификаторов в присваивании
    - unparam                       # Параметры, которые всегда получают одно значение
    - noctx                         # http-запросы без context
    - contextcheck                  # Потеря context в цепочках вызовов
    - nilerr                        # return nil при ненулевой ошибке

  settings:
    revive:
      rules:
        - name: var-naming
          disabled: true
    unused:
      field-writes-are-uses: false
    testifylint:
      enable-all: true
      disable:
        - require-error # require vs assert — уже закреплено ревью; смешение допустимо по контексту
    gocritic:
      # diagnostic = потенциальные баги (реальные находки: ifElseChain, offBy1, sprintfQuotedString).
      # performance-тег (hugeParam/rangeValCopy) и style-тег (paramTypeCombine/unnamedResult)
      # слишком шумные для этого кода — не включены осознанно.
      enable-all: false
      enabled-tags:
        - diagnostic
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      # CLI-делегация через exec.Command("go", ...) — осознанный дизайн (docs/delegation.md);
      # e2e-тесты гоняют собранный бинарь тем же способом.
      - linters:
          - noctx
        path: _test\.go
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

# В v2 форматтеры выделены отдельно и могут участвовать в `run` как проверки.
formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
  # Исключения директорий для форматтеров дублируем, как рекомендует миграция
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - bin
      - var
      - tmp
