name: Bug report
description: Report a bug in go-arch-lint
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!
        Please fill out the information below so we can reproduce and fix the issue.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `go-arch-lint ...`
        2. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened (paste logs / output).
      render: shell
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version
      description: Output of `go version`.
      placeholder: "go version go1.25.0 linux/amd64"
    validations:
      required: true
  - type: input
    id: archlint-version
    attributes:
      label: go-arch-lint version
      description: Output of `go-arch-lint version`.
      placeholder: "go-arch-lint vX.Y.Z"
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration file
      description: The contents of your `.go-arch-lint/main.go` (if relevant).
      render: go
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
