name: release

on:
  push:
    tags:
      - 'v*'
      - '!v[0-9]' # bare major tags (v3) are moved post-release, not releases

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Moving major tag: consumers pin @v3 and stay on the latest v3.x
      # (same convention as the Docker tags below). Runs after GoReleaser
      # so the tag always points at a released commit.
      - name: Move major tag v3
        run: |
          git tag -f v3 "$GITHUB_SHA"
          git push origin "refs/tags/v3" --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
