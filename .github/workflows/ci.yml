name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --config .golangci.yml

  test:
    name: test (${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25.x', '1.26.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run tests
        run: go test ./... -race -cover

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'

      - name: Build
        run: go build ./...

  self-lint:
    name: self-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'

      - name: Check own architecture
        run: go run ./cmd/arch-lint check

  action-smoke:
    name: action smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'

      # The composite action installs the published release by default;
      # for this repo we smoke-test the CURRENT tree instead: build the
      # launcher, put it on PATH, and run the action with install=false.
      - name: Build local go-arch-lint
        run: |
          mkdir -p .action-bin
          go build -o .action-bin/go-arch-lint ./cmd/arch-lint
          echo "$PWD/.action-bin" >> "$GITHUB_PATH"

      - name: Run the composite action on this repo
        uses: ./
        with:
          install: 'false'
          project-path: '.'
