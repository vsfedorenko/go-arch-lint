name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --config .golangci.yml

  test:
    name: test (${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25.13', '1.26.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run tests
        run: go test ./... -race -cover

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'

      - name: Build
        run: go build ./...

  self-lint:
    name: self-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'

      - name: Check own architecture
        run: go run ./cmd/arch-lint check

  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'

      # The README promises the examples are checked; make it true. Each
      # example's .go-arch-lint/ module replaces the dependency with the
      # CURRENT tree (../../../), so this exercises the examples against
      # the code under review, not the last published release.
      - name: Build local launcher
        run: |
          mkdir -p .example-bin
          go build -o .example-bin/go-arch-lint ./cmd/arch-lint
          echo "$PWD/.example-bin" >> "$GITHUB_PATH"

      - name: Check examples
        run: |
          set -e
          for example in basic ddd hexagonal; do
            echo "::group::examples/$example"
            (cd "examples/$example/.go-arch-lint" && go mod tidy)
            (cd "examples/$example" && go-arch-lint check)
            echo "::endgroup::"
          done

  action-smoke:
    name: action smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'

      # The composite action installs the published release by default;
      # for this repo we smoke-test the CURRENT tree instead: build the
      # launcher, put it on PATH, and run the action with install=false.
      - name: Build local go-arch-lint
        run: |
          mkdir -p .action-bin
          go build -o .action-bin/go-arch-lint ./cmd/arch-lint
          echo "$PWD/.action-bin" >> "$GITHUB_PATH"

      - name: Run the composite action on this repo
        uses: ./
        with:
          install: 'false'
          project-path: '.'
